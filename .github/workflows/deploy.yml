# Official Astro -> GitHub Pages workflow (https://docs.astro.build/en/guides/deploy/github/).
# NOT ACTIVATED: it only runs when started by hand (workflow_dispatch). To deploy on every push,
# uncomment the push trigger below, then in the repo: Settings > Pages > Source: GitHub Actions.
# TODO-USER: set SITE_URL / BASE_PATH below for your repo (see README, "Deploy").
name: Deploy to GitHub Pages

on:
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://hamoodim.github.io
      BASE_PATH: /
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v5
      - name: Install, build, and upload your site
        uses: withastro/action@v6
        with:
          node-version: 24
          package-manager: npm

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
